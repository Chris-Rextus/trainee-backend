spring:
  datasource:
    url: jdbc:h2:mem:traineedb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true

server:
  port: 3000

app:
  jwt:
    secret: dev-secret-key-change-in-production
    expiration-ms: 86400000